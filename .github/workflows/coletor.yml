# Coletor ASLAN no GitHub Actions (grátis em repositório PÚBLICO).
# Quem acorda o coletor é o SUPABASE (script 17): a cada 20 min dispara "once" e, a cada clique em "Consultar", "pending".
# O agendamento abaixo é só uma rede de segurança (1x por hora), porque o relógio do GitHub atrasa e pula rodadas.
name: Coletor Bigo

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Tipo de consulta'
        required: true
        default: 'pending'
        type: choice
        options:
          - pending    # atende os pedidos do botão "Consultar" (com novas tentativas)
          - once       # lê todas as integrantes uma vez
          - window     # lê todas e fica atendendo o botão por ~5 min

permissions:
  contents: read

# "once" e "pending" não esperam um pelo outro; duas execuções do mesmo tipo não rodam ao mesmo tempo.
concurrency:
  group: coletor-${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'once' }}
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Navegador (usa o Chrome que já vem no servidor; só baixa se não houver)
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "CHROMIUM_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Consultar a Bigo e atualizar o Supabase
        timeout-minutes: 7
        run: |
          MODE="${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'once' }}"
          case "$MODE" in
            pending) node src/index.mjs --pending 150 ;;
            window)  node src/index.mjs --window 285 ;;
            *)       node src/index.mjs --once ;;
          esac
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BIGO_URL_TEMPLATE: https://www.bigo.tv/pt/{id}
          CONCURRENCY: '4'
          FAST_PATH: '1'
          LIVE_SIGNAL: 'room'
          REFRESH_POLL_SECONDS: '10'
#atualize
