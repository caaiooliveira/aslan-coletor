
name: Coletor Bigo

on:
  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Tipo de consulta'
        required: true
        default: 'pending'
        type: choice
        options:
          - pending
          - once

permissions:
  contents: read

concurrency:
  group: coletor-bigo
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Preparar navegador
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "CHROMIUM_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi

      - name: Definir modalidade
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "command=--once" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ inputs.mode }}" = "once" ]; then
              echo "command=--once" >> "$GITHUB_OUTPUT"
            else
              echo "command=--pending" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Consultar Bigo e atualizar Supabase
        run: node src/index.mjs ${{ steps.mode.outputs.command }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BIGO_URL_TEMPLATE: https://www.bigo.tv/pt/{id}
          CONCURRENCY: '4'
          FAST_PATH: '1'
          LIVE_SIGNAL: 'room'
